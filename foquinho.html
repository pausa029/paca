/* layout: app de uma coluna, cabeçalho fixo em cima, abas fixas embaixo, folhas que sobem para formulários */
:root {
  --bg: #f3f5f2; --surface: #ffffff; --surface-2: #e8ece7; --line: #d5dbd3;
  --fg: #1b2420; --muted: #5a665f; --accent: #0f6e56; --accent-fg: #ffffff; --accent-soft: #d9efe6;
  --study: #2b56b3; --study-soft: #dfe7fa; --move: #c2541a; --move-soft: #fbe5d6;
  --warn: #8a5a00; --warn-soft: #fff1cc; --danger: #b3261e; --danger-soft: #fadcd9; --ok: #1f7a3c;
  --shadow: 0 10px 30px rgba(27, 36, 32, .12);
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: "Poppins", "Inter", system-ui, -apple-system, Arial, sans-serif;
  --fs: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-app-theme="light"]) {
    --bg: #121816; --surface: #1b231f; --surface-2: #243029; --line: #334039;
    --fg: #eef2ee; --muted: #a3b0a8; --accent: #5fd0ab; --accent-fg: #0d1f19; --accent-soft: #1f3a31;
    --study: #8fb0ff; --study-soft: #22304f; --move: #ff9a66; --move-soft: #4a2a1a;
    --warn: #ffd166; --warn-soft: #3d3010; --danger: #ff8a80; --danger-soft: #4a2220; --ok: #6fd48f;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-app-theme="light"]), :root[data-app-theme="dark"] {
  --bg: #121816; --surface: #1b231f; --surface-2: #243029; --line: #334039;
  --fg: #eef2ee; --muted: #a3b0a8; --accent: #5fd0ab; --accent-fg: #0d1f19; --accent-soft: #1f3a31;
  --study: #8fb0ff; --study-soft: #22304f; --move: #ff9a66; --move-soft: #4a2a1a;
  --warn: #ffd166; --warn-soft: #3d3010; --danger: #ff8a80; --danger-soft: #4a2220; --ok: #6fd48f;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}
:root[data-app-theme="light"] {
  --bg: #f3f5f2; --surface: #ffffff; --surface-2: #e8ece7; --line: #d5dbd3;
  --fg: #1b2420; --muted: #5a665f; --accent: #0f6e56; --accent-fg: #ffffff; --accent-soft: #d9efe6;
  --study: #2b56b3; --study-soft: #dfe7fa; --move: #c2541a; --move-soft: #fbe5d6;
  --warn: #8a5a00; --warn-soft: #fff1cc; --danger: #b3261e; --danger-soft: #fadcd9; --ok: #1f7a3c;
  --shadow: 0 10px 30px rgba(27, 36, 32, .12); color-scheme: light;
}
:root[data-font="1"] { --fs: 18px; }
:root[data-font="2"] { --fs: 21px; }

html, body { height: 100%; min-height: 100%; }
/* altura real para o app em navegadores móveis (correção enviada pelo usuário) */
#root { height: 100vh; height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 var(--fs)/1.45 var(--font-body); -webkit-text-size-adjust: 100%; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.5em; } h2 { font-size: 1.1em; } h3 { font-size: 1em; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus, .view:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 1.35em; height: 1.35em; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 1.05em; height: 1.05em; } .ic.xs { width: .9em; height: .9em; vertical-align: -.12em; }

.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 640px; margin: 0 auto; width: 100%; }
.app { height: 100%; min-height: 0; display: flex; flex-direction: column; }
.layer { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.top { flex: none; background: var(--bg); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 10px; padding-block: 10px; min-height: 56px; }
.top h1 { font-size: 1.25em; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.view { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; touch-action: pan-y; }
.page { display: flex; flex-direction: column; gap: 16px; padding-block: 16px 24px; }
.pre .page { padding-block: 24px 32px; }
.tabs { flex: none; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.tabs-in { display: flex; max-width: 640px; margin: 0 auto; }
.tab { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 6px; background: none; border: 0; color: var(--muted); font-size: .72em; font-weight: 500; cursor: pointer; border-top: 3px solid transparent; }
.tab.on { color: var(--accent); border-top-color: var(--accent); }
.tab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.mini { flex: none; display: flex; align-items: center; gap: 10px; width: 100%; max-width: 640px; margin: 0 auto; padding: 10px 16px; border: 0; border-top: 1px solid var(--line); background: var(--accent-soft); color: var(--fg); cursor: pointer; text-align: left; }
.mini.estudo { background: var(--study-soft); } .mini.exercicio { background: var(--move-soft); }
.mini-l { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-t { font-family: var(--font-display); font-weight: 700; font-size: 1.1em; }

.banner { flex: none; }
.banner.demo { background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid var(--line); }
.banner.warn { background: var(--danger-soft); color: var(--danger); border-bottom: 1px solid var(--line); }
.banner-in { display: flex; align-items: center; gap: 10px; padding-block: 8px; font-size: .9em; }
.banner-in p { flex: 1; min-width: 0; } .banner strong { font-weight: 600; }
.banner .btn { background: transparent; border-color: currentColor; color: inherit; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.soft { background: var(--accent-soft); border-color: transparent; }
.card.flush { padding: 0; gap: 0; overflow: hidden; }
.card h2 { display: flex; align-items: center; gap: 8px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sec { font-size: .8em; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; font-family: var(--font-body); margin-top: 4px; }
.sec-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.sub { font-size: 1em; margin-top: 8px; }
.eyebrow { font-size: .78em; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.lead { color: var(--muted); font-size: 1.02em; max-width: 36em; }

/* ---------- utilidades ---------- */
var DAY_MS = 86400000;
var APP_VERSION = '1.0';

function $(sel, el) { return (el || document).querySelector(sel); }
function $all(sel, el) { return Array.prototype.slice.call((el || document).querySelectorAll(sel)); }
function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function now() { return Date.now(); }
function uniq(list) { var seen = {}, out = []; list.forEach(function (x) { if (!has(seen, x)) { seen[x] = 1; out.push(x); } }); return out; }

function slug(s) {
  s = String(s).toLowerCase();
  if (s.normalize) s = s.normalize('NFD').replace(/[̀-ͯ]/g, '');
  return s.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'x';
}
function hashStr(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return Math.abs(h); }
function seeded(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* datas: sempre no horário local do aparelho */
function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function isDayKey(k) { return typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k) && !isNaN(keyToDate(k).getTime()); }
function keyToDate(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0); }
function addDays(k, n) { var d = keyToDate(k); d.setDate(d.getDate() + n); return dayKey(d); }
function diffDays(a, b) { return Math.round((keyToDate(a).getTime() - keyToDate(b).getTime()) / DAY_MS); }
function wdIndex(k) { return (keyToDate(k).getDay() + 6) % 7; } /* 0 = segunda … 6 = domingo */
function weekStart(k) { return addDays(k, -wdIndex(k)); }
var WD_SHORT = ['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'];
var WD_LONG = ['segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado', 'domingo'];
function fmtDay(k) { var p = k.split('-'); return p[2] + '/' + p[1]; }
function fmtDayLong(k) { return WD_LONG[wdIndex(k)] + ', ' + fmtDay(k); }
function fmtClock(ts) { var d = new Date(ts); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function nowHM() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function hmToMin(s) {
  var m = /^(\d{1,2}):(\d{2})$/.exec(s || '');
  if (!m) return null;
  var h = +m[1], mi = +m[2];
  if (h > 23 || mi > 59) return null;
  return h * 60 + mi;
}
function fmtMin(m) {
  m = Math.max(0, Math.round(m));
  if (m < 60) return m + ' min';
  return Math.floor(m / 60) + 'h' + pad2(m % 60);
}
function spokenMin(m) {
  m = Math.max(0, Math.round(m));
  var h = Math.floor(m / 60), r = m % 60, parts = [];
  if (h) parts.push(h + (h === 1 ? ' hora' : ' horas'));
  if (r || !h) parts.push(r + (r === 1 ? ' minuto' : ' minutos'));
  return parts.join(' e ');
}
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
function relDay(k) {
  var n = diffDays(k, dayKey());
  if (n === 0) return 'hoje';
  if (n === 1) return 'amanhã';
  if (n === -1) return 'ontem';
  if (n > 1) return 'em ' + n + ' dias';
  return 'há ' + (-n) + ' dias';
}
function niceMax(v) {
  /* teto "redondo" em minutos para o eixo dos gráficos */
  var steps = [30, 60, 120, 180, 240, 300, 360, 480, 600, 720, 900, 1080, 1440];
  for (var i = 0; i < steps.length; i++) if (v <= steps[i]) return steps[i];
  return 1440;
}

/* ---------- estado e armazenamento (tudo fica neste navegador) ---------- */
var KEY_DEVICE = 'pausa+.v1.device';
function keyData(id) { return 'pausa+.v1.data.' + id; }

var S = {
  device: null,       /* perfis locais e sessão */
  data: null,         /* dados do perfil em uso (ou do modo demonstração) */
  user: null,         /* { id, name } | { id: 'guest' } */
  demo: false,
  route: { name: 'welcome', p: {} },
  stack: [],
  modal: null,
  storageOk: true,
  saveFailed: false,
  tmp: {},
  alerts: [],
  wakeActive: false,
  notifBroken: false,
  dl: null,           /* capacidade de salvar arquivos, quando o visualizador oferece */
  drop: {}, returnFocus: null, focusAfter: null, focusField: null,
  today: null
};
var mem = {};

function probeStorage() {
  try {
    var ls = window.localStorage, k = 'pausa+.probe';
    ls.setItem(k, '1');
    var ok = ls.getItem(k) === '1';
    ls.removeItem(k);
    return ok;
  } catch (e) { return false; }
}
function lsGet(k) {
  if (S.storageOk) { try { return window.localStorage.getItem(k); } catch (e) { /* cai para a memória */ } }
  return has(mem, k) ? mem[k] : null;
}
function lsSet(k, v) {
  mem[k] = v;
  if (!S.storageOk) return false;
  try { window.localStorage.setItem(k, v); return true; } catch (e) { S.saveFailed = true; return false; }
}
function lsDel(k) {
  delete mem[k];
  if (!S.storageOk) return;
  try { window.localStorage.removeItem(k); } catch (e) { /* nada a fazer */ }
}

/* ---------- limpeza de dados lidos (armazenamento ou importação) ---------- */
function str(v, max) { return typeof v === 'string' ? v.replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max || 80) : ''; }
function num(v, lo, hi, def) {
  if (typeof v !== 'number' || !isFinite(v)) return def;
  return clamp(Math.round(v), lo, hi);
}
function numOrNull(v, lo, hi) { return (typeof v === 'number' && isFinite(v)) ? clamp(Math.round(v), lo, hi) : null; }
function arr(v, max) { return Array.isArray(v) ? v.slice(0, max || 500) : []; }
function oneOf(v, list, def) { return list.indexOf(v) >= 0 ? v : def; }
function hm(v, def) { return hmToMin(v) == null ? def : (pad2(Math.floor(hmToMin(v) / 60)) + ':' + pad2(hmToMin(v) % 60)); }

function newDevice() { return { v: 1, profiles: [], session: null, demo: false, lock: { fails: 0, until: 0 } }; }
function loadDevice() {
  var d = newDevice(), raw = lsGet(KEY_DEVICE);
  if (!raw) return d;
  try {
    var x = JSON.parse(raw) || {};
    d.profiles = arr(x.profiles, 30).map(function (p) {
      if (!p || typeof p !== 'object') return null;
      var o = { id: str(p.id, 30), name: str(p.name, 20), salt: str(p.salt, 64), hash: str(p.hash, 128), iter: num(p.iter, 1000, 5000000, 0), createdAt: num(p.createdAt, 0, 9e15, 0) };
      return (o.id && o.name && o.salt && o.hash && o.iter) ? o : null;
    }).filter(Boolean);
    var sess = str(x.session, 30);
    d.session = (sess === 'guest' || d.profiles.some(function (p) { return p.id === sess; })) ? sess : null;
    d.demo = !!x.demo;
    if (x.lock && typeof x.lock === 'object') d.lock = { fails: num(x.lock.fails, 0, 99, 0), until: num(x.lock.until, 0, 9e15, 0) };
  } catch (e) { /* dados ilegíveis: começa do zero */ }
  return d;
}
function saveDevice() { lsSet(KEY_DEVICE, JSON.stringify(S.device)); }

function newData() {
  return {
    v: 1, createdAt: now(), onboarded: false,
    prefs: { sports: [], subjects: [], hard: [], exams: [], usual: null },
    goals: {
      dailyMin: null,
      byDay: { on: false, min: [null, null, null, null, null, null, null] },
      sessionMin: 60,
      gradual: { on: false, step: 15, floor: 120, week: null },
      studyWeek: null, moveWeek: null
    },
    rem: { on: true, pausedUntil: 0, quiet: { on: false, from: '22:00', to: '07:00' }, list: [], firedDay: null, fired: {}, snooze: {} },
    usage: {}, sessions: [], fav: [], later: [], custom: [], plan: null, challenges: [],
    useSession: null, timer: null, splan: planDefaults(), planSessions: [],
    ui: { theme: 'auto', font: 0, sound: true, vibrate: true, awake: true, mood: false },
    flags: {}
  };
}

var KINDS = ['estudo', 'exercicio', 'pausa'];
var REM_KINDS = ['estudo', 'exercicio', 'refeicao', 'dormir', 'outro'];

function normTimer(t) {
  if (!t || typeof t !== 'object') return null;
  var kind = oneOf(t.kind, KINDS, null);
  if (!kind) return null;
  var o = {
    kind: kind, title: str(t.title, 120), subject: str(t.subject, 40) || null, sport: str(t.sport, 44) || null,
    actId: str(t.actId, 160) || null, planId: str(t.planId, 60) || null,
    startedAt: num(t.startedAt, 0, 9e15, now()), paused: !!t.paused,
    remainMs: num(t.remainMs, 0, 6e7, 0), doneFocusMs: num(t.doneFocusMs, 0, 6e8, 0),
    phaseMs: num(t.phaseMs, 1000, 6e7, 60000), planMin: num(t.planMin, 1, 2000, 1),
    endsAt: num(t.endsAt, 0, 9e15, now()), mood0: numOrNull(t.mood0, 1, 5), cyc: null, finished: null
  };
  if (t.cyc && typeof t.cyc === 'object') {
    o.cyc = { focus: num(t.cyc.focus, 1, 180, 25), rest: num(t.cyc.rest, 1, 60, 5), total: num(t.cyc.total, 1, 12, 4), n: num(t.cyc.n, 1, 12, 1), phase: oneOf(t.cyc.phase, ['foco', 'intervalo'], 'foco') };
  }
  if (t.finished && typeof t.finished === 'object') {
    o.finished = { doneMin: num(t.finished.doneMin, 0, 2000, 0), early: !!t.finished.early, at: num(t.finished.at, 0, 9e15, now()) };
  }
  return o;
}

function normalizeData(x) {
  var d = newData();
  if (!x || typeof x !== 'object') return d;
  d.createdAt = num(x.createdAt, 0, 9e15, d.createdAt);
  d.onboarded = !!x.onboarded;

  var p = (x.prefs && typeof x.prefs === 'object') ? x.prefs : {};
  d.prefs.sports = uniq(arr(p.sports, 40).map(function (s) { return str(s, 44); }).filter(Boolean));
  d.prefs.subjects = uniq(arr(p.subjects, 40).map(function (s) { return str(s, 40); }).filter(Boolean));
  d.prefs.hard = uniq(arr(p.hard, 40).map(function (s) { return str(s, 40); })).filter(function (m) { return d.prefs.subjects.indexOf(m) >= 0; });
  d.prefs.exams = arr(p.exams, 60).map(function (e) {
    if (!e || typeof e !== 'object') return null;
    var o = { id: str(e.id, 30) || uid(), subject: str(e.subject, 40), topic: str(e.topic, 80), date: isDayKey(e.date) ? e.date : null };
    return o.subject ? o : null;
  }).filter(Boolean);
  d.prefs.usual = oneOf(p.usual, ['lt2', '2a4', '4a6', '6a8', 'gt8', 'ns'], null);

  var g = (x.goals && typeof x.goals === 'object') ? x.goals : {};
  d.goals.dailyMin = numOrNull(g.dailyMin, 15, 1440);
  if (g.byDay && typeof g.byDay === 'object') {
    d.goals.byDay.on = !!g.byDay.on;
    var mins = arr(g.byDay.min, 7);
    for (var i = 0; i < 7; i++) d.goals.byDay.min[i] = numOrNull(mins[i], 15, 1440);
  }
  d.goals.sessionMin = g.sessionMin === null ? null : num(g.sessionMin, 5, 480, 60);
  if (g.gradual && typeof g.gradual === 'object') {
    d.goals.gradual = { on: !!g.gradual.on, step: num(g.gradual.step, 5, 60, 15), floor: num(g.gradual.floor, 15, 1440, 120), week: isDayKey(g.gradual.week) ? g.gradual.week : null };
  }
  d.goals.studyWeek = numOrNull(g.studyWeek, 10, 3000);
  d.goals.moveWeek = numOrNull(g.moveWeek, 10, 3000);

  var r = (x.rem && typeof x.rem === 'object') ? x.rem : {};
  d.rem.on = r.on !== false;
  d.rem.pausedUntil = num(r.pausedUntil, 0, 9e15, 0);
  if (r.quiet && typeof r.quiet === 'object') d.rem.quiet = { on: !!r.quiet.on, from: hm(r.quiet.from, '22:00'), to: hm(r.quiet.to, '07:00') };
  d.rem.list = arr(r.list, 40).map(function (it) {
    if (!it || typeof it !== 'object') return null;
    var o = {
      id: str(it.id, 30) || uid(), label: str(it.label, 60), kind: oneOf(it.kind, REM_KINDS, 'outro'), time: hm(it.time, null),
      days: uniq(arr(it.days, 7).filter(function (n) { return typeof n === 'number' && n >= 0 && n <= 6 && Math.floor(n) === n; })), on: it.on !== false
    };
    return (o.label && o.time) ? o : null;
  }).filter(Boolean);
  d.rem.firedDay = isDayKey(r.firedDay) ? r.firedDay : null;
  if (r.fired && typeof r.fired === 'object') Object.keys(r.fired).slice(0, 80).forEach(function (k) { d.rem.fired[str(k, 40)] = str(r.fired[k], 10); });
  if (r.snooze && typeof r.snooze === 'object') Object.keys(r.snooze).slice(0, 80).forEach(function (k) { var v = numOrNull(r.snooze[k], 0, 9e15); if (v) d.rem.snooze[str(k, 40)] = v; });

  if (x.usage && typeof x.usage === 'object') {
    Object.keys(x.usage).slice(0, 4000).forEach(function (k) {
      var u = x.usage[k];
      if (!isDayKey(k) || !u || typeof u !== 'object') return;
      var m = numOrNull(u.min, 0, 1440);
      if (m == null) return;
      d.usage[k] = { min: m, at: num(u.at, 0, 9e15, keyToDate(k).getTime()), goal: numOrNull(u.goal, 15, 1440) };
    });
  }
  d.sessions = arr(x.sessions, 20000).map(function (s) {
    if (!s || typeof s !== 'object') return null;
    var kind = oneOf(s.kind, KINDS, null), m = numOrNull(s.min, 1, 1000), start = numOrNull(s.start, 0, 9e15);
    if (!kind || m == null || start == null) return null;
    return {
      id: str(s.id, 30) || uid(), kind: kind, title: str(s.title, 120), subject: str(s.subject, 40) || null, sport: str(s.sport, 44) || null,
      actId: str(s.actId, 160) || null, plan: num(s.plan, 1, 2000, m), min: m, start: start, end: num(s.end, 0, 9e15, start),
      day: isDayKey(s.day) ? s.day : dayKey(new Date(start)), m0: numOrNull(s.m0, 1, 5), m1: numOrNull(s.m1, 1, 5)
    };
  }).filter(Boolean);
  d.fav = uniq(arr(x.fav, 400).map(function (s) { return str(s, 160); }).filter(Boolean));
  d.later = uniq(arr(x.later, 400).map(function (s) { return str(s, 160); }).filter(Boolean));
  d.custom = arr(x.custom, 200).map(function (c) {
    if (!c || typeof c !== 'object') return null;
    var o = { id: str(c.id, 30) || uid(), kind: oneOf(c.kind, ['estudo', 'exercicio'], 'estudo'), title: str(c.title, 80), min: num(c.min, 1, 240, 10), place: oneOf(c.place, ['c', 'f', 'q', 'l'], 'q'), energy: oneOf(c.energy, ['t', 'm', 'a'], 't') };
    return o.title ? o : null;
  }).filter(Boolean);
  if (x.plan && typeof x.plan === 'object' && str(x.plan.text, 160)) d.plan = { text: str(x.plan.text, 160), min: num(x.plan.min, 1, 120, 5), kind: oneOf(x.plan.kind, KINDS, 'pausa') };
  d.challenges = arr(x.challenges, 200).map(function (c) {
    if (!c || typeof c !== 'object') return null;
    var type = oneOf(c.type, ['studyDays', 'moveMin', 'pauses', 'goalDays', 'hardMin'], null);
    if (!type || !isDayKey(c.week)) return null;
    return { id: str(c.id, 30) || uid(), type: type, target: num(c.target, 1, 3000, 1), param: str(c.param, 40) || null, week: c.week };
  }).filter(Boolean);
  if (x.useSession && typeof x.useSession === 'object' && numOrNull(x.useSession.start, 0, 9e15) != null) {
    d.useSession = { start: num(x.useSession.start, 0, 9e15, now()), limit: num(x.useSession.limit, 5, 480, 60), alerted: !!x.useSession.alerted, snooze: num(x.useSession.snooze, 0, 9e15, 0) };
  }
  d.timer = normTimer(x.timer);
  d.splan = normPlan(x.splan);
  d.planSessions = normPlanSessions(x.planSessions, d.prefs.subjects);

  var u2 = (x.ui && typeof x.ui === 'object') ? x.ui : {};
  d.ui = {
    theme: oneOf(u2.theme, ['auto', 'light', 'dark'], 'auto'), font: num(u2.font, 0, 2, 0),
    sound: u2.sound !== false, vibrate: u2.vibrate !== false, awake: u2.awake !== false, mood: !!u2.mood
  };
  if (x.flags && typeof x.flags === 'object') Object.keys(x.flags).slice(0, 60).forEach(function (k) { d.flags[str(k, 40)] = str(String(x.flags[k]), 40); });
  return d;
}

function loadData(id) {
  var raw = lsGet(keyData(id));
  if (!raw) return null;
  try { return normalizeData(JSON.parse(raw)); }
  catch (e) {
    lsSet(keyData(id) + '.ilegivel', raw);
    S.tmp.loadError = true;
    return null;
  }
}
function save() {
  if (S.demo || !S.user || !S.data) return;
  lsSet(keyData(S.user.id), JSON.stringify(S.data));
}

/* ---------- modo demonstração: dados fictícios, gerados na hora e nunca salvos ---------- */
function demoData() {
  var d = newData(), today = dayKey(), rnd = seeded(hashStr('pausa-demo-' + today));
  var startToday = new Date(); startToday.setHours(0, 0, 0, 0);
  d.onboarded = true;
  d.prefs.sports = ['futebol', 'corrida', 'corda'];
  d.prefs.subjects = ['Matemática', 'Português', 'História', 'Física', 'Inglês'];
  d.prefs.hard = ['Matemática', 'Física'];
  d.prefs.exams = [
    { id: 'demo1', subject: 'Matemática', topic: 'Equações do 2º grau', date: addDays(today, 4) },
    { id: 'demo2', subject: 'História', topic: 'Era Vargas', date: addDays(today, 9) },
    { id: 'demo3', subject: 'Física', topic: 'Leis de Newton', date: addDays(today, 16) }
  ];
  d.prefs.usual = '4a6';
  d.goals.dailyMin = 285;
  d.goals.gradual = { on: true, step: 15, floor: 180, week: weekStart(addDays(today, -7)) };
  d.goals.studyWeek = 240;
  d.goals.moveWeek = 120;
  d.rem.list = [
    { id: 'r1', label: 'Hora de estudar', kind: 'estudo', time: '19:00', days: [0, 1, 2, 3, 4], on: true },
    { id: 'r2', label: 'Treino ou caminhada', kind: 'exercicio', time: '17:00', days: [0, 2, 4, 5], on: true },
    { id: 'r3', label: 'Celular longe na hora de dormir', kind: 'dormir', time: '22:30', days: [0, 1, 2, 3, 4, 5, 6], on: true }
  ];
  d.rem.quiet = { on: true, from: '22:45', to: '07:00' };

  var subs = d.prefs.subjects, i, k;
  for (i = 20; i >= 1; i--) {
    k = addDays(today, -i);
    var wknd = wdIndex(k) >= 5;
    if (i !== 5 && i !== 12) {
      var base = 268 + i * 5.5 + (wknd ? 35 : 0);
      var min = Math.round((base + (rnd() - 0.5) * 50) / 5) * 5;
      d.usage[k] = { min: min, at: keyToDate(addDays(k, 1)).getTime() - 4 * 3600000, goal: i > 13 ? 315 : (i > 6 ? 300 : 285) };
    }
    var noon = keyToDate(k).getTime();
    if (rnd() < (wknd ? 0.45 : 0.8)) {
      var m = subs[Math.floor(rnd() * subs.length)], sm = [20, 25, 25, 30, 50][Math.floor(rnd() * 5)];
      d.sessions.push({ id: 'ds' + i, kind: 'estudo', title: 'Resolver 5 exercícios: ' + m, subject: m, sport: null, actId: null, plan: sm, min: sm, start: noon + 7 * 3600000, end: noon + 7 * 3600000 + sm * 60000, day: k, m0: 3, m1: 4 });
    }
    if (rnd() < (wknd ? 0.7 : 0.5)) {
      var em = [10, 20, 20, 30][Math.floor(rnd() * 4)], sp = rnd() < 0.5 ? ['futebol', 'Embaixadinhas: tente bater seu recorde'] : ['corrida', 'Corrida leve, em ritmo de conversa'];
      d.sessions.push({ id: 'de' + i, kind: 'exercicio', title: sp[1], subject: null, sport: sp[0], actId: null, plan: em, min: em, start: noon + 5 * 3600000, end: noon + 5 * 3600000 + em * 60000, day: k, m0: 3, m1: 5 });
    }
    if (rnd() < 0.4) {
      d.sessions.push({ id: 'dp' + i, kind: 'pausa', title: 'Alongar pescoço, ombros e punhos', subject: null, sport: null, actId: null, plan: 5, min: 5, start: noon + 3 * 3600000, end: noon + 3 * 3600000 + 300000, day: k, m0: null, m1: null });
    }
  }
  var t0 = Math.max(startToday.getTime(), now() - 150 * 60000);
  d.usage[today] = { min: 150, at: Math.max(startToday.getTime(), now() - 35 * 60000), goal: 285 };
  d.sessions.push({ id: 'dt1', kind: 'estudo', title: 'Revisar as anotações: Matemática · Equações do 2º grau', subject: 'Matemática', sport: null, actId: null, plan: 25, min: 25, start: t0, end: t0 + 25 * 60000, day: today, m0: 3, m1: 4 });

/* ---------- perfil local com senha protegida (PBKDF2-SHA-256 com sal aleatório) ---------- */
var CRYPTO_OK = !!(window.crypto && window.crypto.subtle && window.crypto.getRandomValues && typeof TextEncoder !== 'undefined');

function b64(buf) {
  var b = new Uint8Array(buf), s = '';
  for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s);
}
function unb64(s) {
  var bin = atob(s), u = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function normName(s) {
  s = String(s || '').replace(/\s+/g, ' ').trim();
  if (s.normalize) s = s.normalize('NFC');
  return s;
}
function normPass(s) { s = String(s || ''); return s.normalize ? s.normalize('NFC') : s; }
function validName(s) { return s.length >= 3 && s.length <= 20 && /^[A-Za-zÀ-ÿ0-9 ._-]+$/.test(s); }
function findProfile(name) {
  var n = normName(name).toLowerCase(), list = S.device.profiles;
  for (var i = 0; i < list.length; i++) if (list[i].name.toLowerCase() === n) return list[i];
  return null;
}

async function pbkdf2(password, saltBytes, iter) {
  var key = await window.crypto.subtle.importKey('raw', new TextEncoder().encode(password), { name: 'PBKDF2' }, false, ['deriveBits']);
  var bits = await window.crypto.subtle.deriveBits({ name: 'PBKDF2', salt: saltBytes, iterations: iter, hash: 'SHA-256' }, key, 256);
  return b64(bits);
}
/* mede o aparelho e escolhe quantas rodadas cabem em cerca de meio segundo */
async function calibrateIter() {
  var salt = window.crypto.getRandomValues(new Uint8Array(16));
  var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
  await pbkdf2('calibrar', salt, 20000);
  var t1 = (window.performance && performance.now) ? performance.now() : Date.now();
  var dt = Math.max(1, t1 - t0);
  return clamp(Math.round((20000 * 450 / dt) / 10000) * 10000, 120000, 600000);
}

function lockWait() { return Math.max(0, Math.ceil((S.device.lock.until - now()) / 1000)); }

async function createProfile(name, pass, pass2) {
  if (!CRYPTO_OK) return { ok: false, err: 'Este navegador não tem o recurso necessário para proteger senhas. Você pode usar o Foquinho sem conta.' };
  name = normName(name); pass = normPass(pass); pass2 = normPass(pass2);
  if (!validName(name)) return { ok: false, field: 'su-name', err: 'Use de 3 a 20 caracteres: letras, números, espaço, ponto, hífen ou sublinhado.' };
  if (findProfile(name)) return { ok: false, field: 'su-name', err: 'Já existe um perfil com esse nome neste aparelho.' };
  if (pass.length < 6) return { ok: false, field: 'su-pass', err: 'A senha precisa ter pelo menos 6 caracteres.' };
  if (pass.toLowerCase() === name.toLowerCase()) return { ok: false, field: 'su-pass', err: 'A senha não pode ser igual ao nome de usuário.' };
  if (pass !== pass2) return { ok: false, field: 'su-pass2', err: 'As duas senhas não são iguais.' };
  try {
    var iter = await calibrateIter();
    var salt = window.crypto.getRandomValues(new Uint8Array(16));
    var hash = await pbkdf2(pass, salt, iter);
    var prof = { id: 'p' + uid(), name: name, salt: b64(salt), hash: hash, iter: iter, createdAt: now() };
    /* quem estava usando sem conta leva os dados para o perfil novo; fora disso o perfil começa vazio */
    var fromGuest = !!(S.user && S.user.id === 'guest' && !S.demo && S.data);
    var data = fromGuest ? S.data : newData();
    S.device.profiles.push(prof);
    S.device.session = prof.id;
    S.device.demo = false;
    S.demo = false;
    S.user = { id: prof.id, name: prof.name };
    S.data = data;
    saveDevice();
    save();
    if (fromGuest) lsDel(keyData('guest'));
    return { ok: true, migrated: fromGuest };
  } catch (e) {
    return { ok: false, err: 'Não foi possível proteger a senha neste navegador. Você pode usar o Foquinho sem conta.' };
  }
}

async function checkPassword(prof, pass) {
  var hash = await pbkdf2(normPass(pass), unb64(prof.salt), prof.iter);
  return hash === prof.hash;
}

async function login(name, pass) {
  if (!CRYPTO_OK) return { ok: false, err: 'Este navegador não consegue conferir senhas com segurança.' };
  var wait = lockWait();
  if (wait > 0) return { ok: false, err: 'Muitas tentativas seguidas. Aguarde ' + wait + ' segundos e tente de novo.' };
  var prof = findProfile(name);
  var okPass = false;
  try { if (prof) okPass = await checkPassword(prof, pass); } catch (e) { return { ok: false, err: 'Não foi possível conferir a senha neste navegador.' }; }
  if (!prof || !okPass) {
    S.device.lock.fails++;
    if (S.device.lock.fails >= 5) { S.device.lock = { fails: 0, until: now() + 30000 }; }
    saveDevice();
    return { ok: false, field: 'li-pass', err: 'Nome de usuário ou senha incorretos.' };
  }
  S.device.lock = { fails: 0, until: 0 };
  S.device.session = prof.id;
  S.device.demo = false;
  S.demo = false;
  S.user = { id: prof.id, name: prof.name };
  S.data = loadData(prof.id) || newData();
  saveDevice();
  return { ok: true };
}

async function changePassword(cur, nw, nw2) {
  var prof = currentProfile();
  if (!prof) return { ok: false, err: 'Nenhum perfil com senha em uso.' };
  nw = normPass(nw); nw2 = normPass(nw2);
  try {
    if (!(await checkPassword(prof, cur))) return { ok: false, field: 'pw-cur', err: 'A senha atual não confere.' };
    if (nw.length < 6) return { ok: false, field: 'pw-new', err: 'A nova senha precisa ter pelo menos 6 caracteres.' };
    if (nw.toLowerCase() === prof.name.toLowerCase()) return { ok: false, field: 'pw-new', err: 'A senha não pode ser igual ao nome de usuário.' };
    if (nw !== nw2) return { ok: false, field: 'pw-new2', err: 'As duas senhas novas não são iguais.' };
    var iter = await calibrateIter();
    var salt = window.crypto.getRandomValues(new Uint8Array(16));
    prof.hash = await pbkdf2(nw, salt, iter);
    prof.salt = b64(salt);
    prof.iter = iter;
    saveDevice();
    return { ok: true };
  } catch (e) {
    return { ok: false, err: 'Não foi possível trocar a senha neste navegador.' };
  }
}

var TRACK_P = 220 + 2 * Math.PI * 60;
function trackPoint(f) {
  var r = 60, L1 = 55, A = Math.PI * r, L2 = 110, s = clamp(f, 0, 1) * TRACK_P;

  s -= A;
  if (s <= L2) return [205 - s, 155];
  s -= L2;
  if (s <= A) return [95 + r * Math.cos(Math.PI / 2 + s / r), 95 + r * Math.sin(Math.PI / 2 + s / r)];

function inApp() { return !!S.data && !!S.user && !ROUTES[S.route.name].pre; }
function go(name, p) {
  var cur = ROUTES[S.route.name];
  if (ROUTES[name].sub && !cur.pre) S.stack.push(S.route); else S.stack = [];
  if (S.stack.length > 12) S.stack.shift();
  S.route = { name: name, p: p || {} };
  S.modal = null;
  S.tmp.err = null;
}
function back() {
  S.route = S.stack.pop() || { name: 'more', p: {} };
  S.modal = null;
  S.tmp.err = null;
}
function openModal(m) {
  var act = document.activeElement;
  if (!S.modal) S.returnFocus = act && act.id ? act.id : null;
  m.fresh = true;

}
function closeModal() { S.modal = null; S.focusAfter = S.returnFocus; S.returnFocus = null; }

var toastTimer = null;
function toast(msg) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.hidden = false;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.hidden = true; el.textContent = ''; }, 4200);
}
function announce(msg) {
  var el = document.getElementById('live');
  if (!el) return;
  el.textContent = '';
  setTimeout(function () { el.textContent = msg; }, 60);
}

function routeKey() { return S.route.name + '|' + (S.route.name === 'onboard' ? (S.tmp.ob || 0) : ''); }

var lastKey = null, rendering = false;
function render() {
  if (rendering) return;
  rendering = true;
  try {
    var root = document.getElementById('root'), keep = {}, act = document.activeElement;
    var focusId = act && act.id ? act.id : null, selS = null, selE = null;
    var key = routeKey(), same = key === lastKey, view = document.getElementById('view');
    var top = (view && same) ? view.scrollTop : 0;
    var sheet = document.getElementById('modal'), sheetTop = sheet ? sheet.scrollTop : 0;
    var freshModal = !!(S.modal && S.modal.fresh);
    if (same && !freshModal) {
      $all('[data-keep]', root).forEach(function (el) { if (el.id) keep[el.id] = el.type === 'checkbox' ? el.checked : el.value; });
      try { if (act && typeof act.selectionStart === 'number') { selS = act.selectionStart; selE = act.selectionEnd; } } catch (e) { /* tipos sem seleção */ }
    }
    var drop = S.drop || {};
    S.drop = {};
    applyLook();
    root.innerHTML = appHTML();
    lastKey = key;
    $all('[data-keep]', root).forEach(function (el) {
      if (!el.id || !has(keep, el.id) || drop[el.id]) return;
      if (el.type === 'checkbox') el.checked = keep[el.id]; else if (el.type !== 'file') el.value = keep[el.id];
    });
    view = document.getElementById('view');
    if (view) view.scrollTop = top;
    sheet = document.getElementById('modal');
    if (sheet && !freshModal) sheet.scrollTop = sheetTop;

    var target = null;
    if (S.modal) {
      if (freshModal) { S.modal.fresh = false; target = $('[data-autofocus]', sheet) || document.getElementById('m-title'); }
      else target = focusId ? document.getElementById(focusId) : null;
      if (target && !sheet.contains(target)) target = document.getElementById('m-title');
    } else if (S.focusAfter) {
      target = document.getElementById(S.focusAfter);
      S.focusAfter = null;
    } else if (!same) {
      target = document.getElementById('title');
    } else if (focusId) {
      target = document.getElementById(focusId);
    }
    if (S.focusField) { target = document.getElementById(S.focusField) || target; S.focusField = null; }
    if (target && target.focus) {
      try { target.focus({ preventScroll: same && !freshModal }); } catch (e) { target.focus(); }
      if (selS != null && target.id === focusId) { try { target.setSelectionRange(selS, selE); } catch (e2) { /* ignorado */ } }
    }
    paintTimer(true);
  } finally { rendering = false; }
}

/* atualiza só os números do temporizador, sem redesenhar a tela */
var lastClock = '';
function paintTimer(force) {
  var t = S.data && S.data.timer;
  var u = S.data && S.data.useSession, ue = document.getElementById('use-elapsed');
  if (u && ue) {
    var txt = 'há ' + fmtMin((now() - u.start) / 60000);
    if (ue.textContent !== txt) ue.textContent = txt;
  }
  if (!t || t.finished) return;
  var rem = timerRemain(t), txt2 = clockText(rem);
  if (!force && txt2 === lastClock) return;
  lastClock = txt2;
  var mt = document.getElementById('mini-time');
  if (mt) mt.textContent = txt2;
  var tt = document.getElementById('tk-time');
  if (tt) {
    tt.innerHTML = clockTspans(txt2);
    var frac = 1 - rem / t.phaseMs, pt = trackPoint(frac);
    var run = document.getElementById('tk-run'), dot = document.getElementById('tk-dot'), sr = document.getElementById('timer-sr');
    if (run) run.setAttribute('stroke-dashoffset', (TRACK_P * (1 - clamp(frac, 0, 1))).toFixed(2));
    if (dot) { dot.setAttribute('cx', pt[0].toFixed(1)); dot.setAttribute('cy', pt[1].toFixed(1)); }
    if (sr) sr.textContent = 'Faltam ' + spokenMin(Math.ceil(rem / 60000)) + '.';
  }
}
function paintWake() {
  var el = document.getElementById('wake-state');
  if (el) el.textContent = wakeText();

function wakeText() {
  if (!wakeSupported()) return 'Este navegador não mantém a tela ligada. Se a tela apagar, o aviso sonoro não toca; ao voltar, o Foquinho mostra que o tempo terminou.';
  if (!S.data.ui.awake) return 'Manter a tela ligada está desativado. Se a tela apagar, o aviso sonoro não toca.';
  if (S.wakeActive) return 'A tela fica ligada enquanto o temporizador estiver aberto, para o aviso tocar no fim.';
  return 'O navegador não manteve a tela ligada agora. Se ela apagar, o aviso sonoro não toca.';
}

function usageChart(w) {
  var top = 0;
  w.days.forEach(function (s) { if (s.usage != null) top = Math.max(top, s.usage); if (s.goal != null && s.usage != null) top = Math.max(top, s.goal); });
  top = niceMax(Math.max(top, 60));
  var cols = w.days.map(function (s, i) {
    var inner = '';
    if (s.usage != null && s.goal != null) inner += '<i class="goal-tick" style="bottom:' + (s.goal * 100 / top).toFixed(1) + '%"></i>';
    if (s.usage != null) {
      var hgt = Math.max(1.5, s.usage * 100 / top);
      inner += '<i class="colbar' + (s.partial ? ' partial' : '') + '" style="height:' + hgt.toFixed(1) + '%"></i><span class="colval" style="bottom:' + hgt.toFixed(1) + '%">' + fmtMin(s.usage).replace(' min', 'm') + '</span>';
    } else inner += '<span class="colnone">–</span>';
    var mark = s.within === true ? ic('check', 'xs') : (s.within === false ? '<b class="up">↑</b>' : '');
    return '<div class="colw"><div class="plot">' + inner + '</div><span class="colmark">' + mark + '</span><span class="collab">' + WD_SHORT[i] + '</span></div>';
  }).join('');
  return '<div class="chart" aria-hidden="true"><div class="yax"><span>' + fmtMin(top) + '</span><span>' + fmtMin(top / 2) + '</span><span>0</span></div><div class="cols">' + cols + '</div></div>' +
    '<p class="legend" aria-hidden="true"><span><i class="lg solid"></i>tempo informado</span><span><i class="lg stripe"></i>valor parcial</span><span><i class="lg tick"></i>meta do dia</span><span>' + ic('check', 'xs') + 'dentro da meta</span><span><b class="up">↑</b>acima da meta</span><span>– sem dados</span></p>';
}
function activityChart(w) {
  var top = 0;

    }

    '<p class="legend" aria-hidden="true"><span><i class="lg estudo"></i>estudo</span><span><i class="lg exercicio"></i>exercício</span><span>valores em minutos</span></p>';

SCREENS.challenges = function () {

/* ---------- ações: o que cada botão, chave e formulário faz ---------- */
function dv(el) { return el.getAttribute('data-v'); }
function dk(el) { return el.getAttribute('data-k'); }
function fakeEl(value) { return { getAttribute: function (n) { return n === 'data-v' ? value : null; } }; }
function toggleIn(list, item) { var i = list.indexOf(item); if (i >= 0) list.splice(i, 1); else list.push(item); return i < 0; }
function intVal(id) { var s = String(val(id)).trim(); if (s === '') return null; var n = parseInt(s, 10); return isNaN(n) ? NaN : n; }
function resume() {
  var sess = S.device.session, i;
  S.user = null; S.data = null;
  if (sess === 'guest') { S.user = { id: 'guest' }; S.data = loadData('guest') || newData(); }
  else if (sess) {
    for (i = 0; i < S.device.profiles.length; i++) if (S.device.profiles[i].id === sess) { S.user = { id: sess, name: S.device.profiles[i].name }; S.data = loadData(sess) || newData(); }
  }
  if (!S.user) { S.device.session = null; return 'welcome'; }
  return S.data.onboarded ? 'home' : 'onboard';
}
function enter(route) {
  if (route === 'onboard') S.tmp.ob = 0;
  S.stack = [];
  S.route = { name: route, p: {} };
  S.modal = null;
  S.tmp.err = null;
}
function finishOnboard() {
  S.data.onboarded = true;
  save();
  enter('home');
  toast('Tudo pronto. Suas escolhas podem ser ajustadas em Mais.');
}
function confirmBox(title, text, yes, act, value, danger) { openModal({ t: 'confirm', title: title, text: text, yes: yes, act: act, v: value, danger: !!danger }); }
function busyTimer() {
  if (!S.data.timer) return false;
  go('timer');
  toast('Já existe um tempo em andamento.');
  return true;
}

  S.tmp.busy = true; S.tmp.err = null;

  var r = await createProfile(name, p1, p2);
  S.tmp.busy = false;
  if (!r.ok) { S.tmp.err = { msg: r.err, field: r.field }; S.focusField = r.field || null; return; }
  S.drop['su-pass'] = true; S.drop['su-pass2'] = true;
  enter(S.data.onboarded ? 'home' : 'onboard');

};

/* dados: exportar, importar */
function exportPayload() {
  var copy = JSON.parse(JSON.stringify(S.data));
  copy.timer = null; copy.useSession = null;
  return JSON.stringify({ app: 'Foquinho', version: APP_VERSION, exportedAt: new Date().toISOString(), profile: (S.user && S.user.name) || null, demo: S.demo || undefined, data: copy }, null, 2);
}
function exportCsvText() {
  var d = S.data, keys = Object.keys(d.usage).concat(d.sessions.map(function (s) { return s.day; })).sort();
  var rows = ['data;dia;tela_min;tela_parcial;meta_min;dentro_da_meta;estudo_min;exercicio_min;pausa_min'];
  if (keys.length) {
    var k0 = keys[0], k1 = keys[keys.length - 1], guard = 0;
    for (var day = k0; day <= k1 && guard++ < 4000; day = addDays(day, 1)) {
      var s = dayStats(d, day);
      rows.push([day, WD_SHORT[wdIndex(day)], s.usage == null ? '' : s.usage, s.usage == null ? '' : (s.partial ? 'sim' : 'nao'), s.goal == null ? '' : s.goal, s.within == null ? '' : (s.within ? 'sim' : 'nao'), s.study, s.move, s.pause].join(';'));
    }
  }
  return '﻿' + rows.join('\r\n') + '\r\n';
}
function deliver(name, text) {
  if (!S.dl) { openModal({ t: 'exportText', name: name, text: text }); return; }
  S.dl.save({ filename: name, data: text }).then(function () { toast('Arquivo entregue para salvar: ' + name); }, function (e) {
    if (e && e.code === 'declined') { toast('Exportação cancelada.'); return; }
    openModal({ t: 'exportText', name: name, text: text });
    render();
  });
}
A.exportJson = function () { deliver('foquinho-dados-' + dayKey() + '.json', exportPayload()); };
A.exportCsv = function () { deliver('foquinho-historico-' + dayKey() + '.csv', exportCsvText()); };
A.copyExport = function () {
  var ta = document.getElementById('ex-text');
  if (!ta) return false;
  function fallback() {
    try { ta.focus(); ta.select(); var ok = document.execCommand && document.execCommand('copy'); toast(ok ? 'Copiado.' : 'Texto selecionado. Use o menu do aparelho para copiar.'); }
    catch (e) { toast('Texto selecionado. Use o menu do aparelho para copiar.'); }
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(function () { toast('Copiado.'); }, fallback);
    else fallback();
  } catch (e) { fallback(); }
  return false;
};
A.importOpen = function () { if (!S.demo) openModal({ t: 'importData' }); };
CHANGES.importFile = function (el) {
  var file = el.files && el.files[0];
  if (!file || !window.FileReader) return false;
  if (file.size > 5000000) { toast('Arquivo grande demais para ser uma cópia do Foquinho.'); return false; }
  var fr = new FileReader();
  fr.onload = function () { var ta = document.getElementById('im-text'); if (ta) ta.value = String(fr.result || ''); };
  fr.onerror = function () { toast('Não foi possível ler o arquivo.'); };
  fr.readAsText(file);
  return false;
};
FORMS.importData = function () {
  var m = S.modal, raw = String(val('im-text')).trim(), x;
  if (!raw) { m.err = 'Escolha um arquivo ou cole o conteúdo da cópia.'; return; }
  try { x = JSON.parse(raw); } catch (e) { m.err = 'O conteúdo não é um JSON válido.'; return; }
  if (!x || (x.app !== 'Foquinho' && x.app !== 'Pausa+') || !x.data || typeof x.data !== 'object') { m.err = 'Este arquivo não parece uma cópia exportada pelo Foquinho.'; return; }
  wakeOff();
  S.data = normalizeData(x.data);
  S.data.onboarded = true;
  S.data.timer = null;
  S.data.useSession = null;
  S.tmp = {};
  save();
  enter('home');
  toast('Cópia importada.');
};

function monthStart(k) { return k.slice(0, 8) + '01'; }
function monthEnd(k) { var d = keyToDate(k); return dayKey(new Date(d.getFullYear(), d.getMonth() + 1, 0, 12)); }
var MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

function agRange(a) { return a.mode === 'semana' ? { from: a.start, to: addDays(a.start, 6) } : { from: monthStart(a.start), to: monthEnd(a.start) }; }

function psRow(p) {

  return '<li><button type="button" class="nav-row ps" id="ps-' + esc(p.id) + '" data-act="psOpen" data-v="' + esc(p.id) + '">' +
    '<span class="li-ic ' + (st === 'concluida' ? 'ok' : (st === 'naoRealizada' ? 'no' : 'estudo')) + '" aria-hidden="true">' + ic(icon) + '</span>' +

    '<span class="li-d">' + p.minutes + ' min · ' + PLAN_STATE_LABEL[st] + extra + '</span></span>' + ic('right', 'sm') + '</button></li>';
}
function dayBlock(d, key, list) {
  var today = dayKey(), act = list.filter(psOccupies), mins = 0;
  act.forEach(function (p) { mins += p.minutes; });
  var head = WD_SHORT[wdIndex(key)] + ' ' + fmtDay(key) + (key === today ? ' · hoje' : '');
  var info = act.length ? plural(act.length, 'sessão', 'sessões') + ' · ' + fmtMin(mins) : (planDayAvailable(d.splan, key) ? 'sem sessões' : (d.splan.blocked.indexOf(key) >= 0 ? 'data bloqueada' : 'descanso'));
  return '<section class="card flush dayblock' + (key === today ? ' today' : '') + '"><h3 class="day-h"><span>' + esc(head) + '</span><span class="day-i">' + esc(info) + '</span></h3>' +
    d.prefs.exams.filter(function (e) { return e.date === key; }).map(function (e) {
      return '<p class="status near dayitem">' + ic('info', 'sm') + '<span>Prova ou trabalho neste dia: ' + esc(e.subject + (e.topic ? ' · ' + e.topic : '')) + '</span></p>';

/* Provas dos próximos 14 dias e sugestão de sessão antes de cada uma. */
function boardSuggestions(d) {
  var today = dayKey(), out = [];
  d.prefs.exams.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (e) {
    if (!isDayKey(e.date)) return;
    var left = diffDays(e.date, today);
    if (left < 0 || left > 14) return;
    var lastK = addDays(e.date, -1), wanted = Math.min(3, left);
    var planned = d.planSessions.filter(function (p) { return p.subject === e.subject && (p.state === 'planejada' || p.state === 'concluida') && p.day >= today && p.day <= lastK; }).length;
    var slot = null;
    if (planned < wanted && d.splan.configured) {
      var opts = planSuggestSlots(d, today, d.splan.sessionMin, new Date(), null, 14).filter(function (o) { return o.day <= lastK; });
      slot = opts.filter(function (o) { return !d.planSessions.some(function (p) { return p.day === o.day && p.subject === e.subject && psOccupies(p); }); })[0] || opts[0] || null;
    }
    out.push({ exam: e, left: left, planned: planned, wanted: wanted, slot: slot });
  });
  return out;
}

      (x.wanted ? ' · ' + x.planned + ' de ' + x.wanted + ' sessões sugeridas no mural' : '') + '</p>' +
